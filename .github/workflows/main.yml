# -------------------------------------------------------------------
# CI – Continuous Integration
#
# Was passiert hier?
#
#  1. Eine frische Ubuntu-VM wird gestartet
#  2. Python + alle Abhängigkeiten werden installiert
#  3. pytest läuft durch alle Tests
#
# -------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 aufsetzen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        working-directory: LF11/backend
        run: pip install -r requirement.txt

      - name: Tests ausführen
        working-directory: LF11/backend
        run: pytest tests/ -v
        # -v = verbose: zeigt jeden einzelnen Test mit Namen an
